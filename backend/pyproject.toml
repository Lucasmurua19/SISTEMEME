[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-solana"
version = "0.1.0"
description = "Radar de memecoins migradas de Pump.fun a PumpSwap: detección, ranking y simulación de resultados."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
  "websockets>=13,<16",
  "base58>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
]
# PostgreSQL embebido para las pruebas de tests/postgres (alternativa: TEST_DATABASE_URL)
pgtest = [
  "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "error::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # el largo de línea lo cubre el formateador
  "B008",  # FastAPI usa Depends()/Query() como valores por defecto: es el patrón documentado
]
